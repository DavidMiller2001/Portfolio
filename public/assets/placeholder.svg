<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot placeholder</title>
  <desc id="desc">Placeholder image for project screenshots</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#e9d8f3"/>
      <stop offset="1" stop-color="#c9acec"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="14" fill="url(#g)" />
  <g fill="#2d1a4c" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="36">
    <text x="50%" y="46%" dominant-baseline="middle" text-anchor="middle">Screenshot placeholder</text>
    <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-size="20" font-weight="500">Replace with site screenshot or image file</text>
  </g>
</svg>
